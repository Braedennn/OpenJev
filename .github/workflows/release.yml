name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: harness
    env:
      DSH_CLIENT_COMMIT_HASH: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: harness/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Package desktop app (unsigned)
        run: pnpm package:desktop:win:x64:unsigned

      - name: Zip portable build
        shell: pwsh
        run: |
          Compress-Archive -Path '.desktop-build/targets/win-x64/unsigned-artifacts/win-unpacked/*' `
            -DestinationPath '.desktop-build/targets/win-x64/unsigned-artifacts/OpenJev-portable-win-x64.zip' -Force

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenJev-win-x64
          if-no-files-found: error
          path: |
            harness/apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/openjev-*-win-x64.exe
            harness/apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/openjev-*-win-x64.exe.blockmap
            harness/apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/OpenJev-portable-win-x64.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            harness/apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/openjev-*-win-x64.exe
            harness/apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/openjev-*-win-x64.exe.blockmap
            harness/apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/OpenJev-portable-win-x64.zip
